version: '3.8'

services:
  ai-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-router
    ports:
      - "11434:11434"
    environment:
      # Server Configuration
      - NODE_ENV=production
      - PORT=11434
      - LOG_LEVEL=info
      
      # Gemini Web Automation
      - GEMINI_WEB_ENABLED=${GEMINI_WEB_ENABLED:-false}
      - GOOGLE_EMAIL=${GOOGLE_EMAIL:-}
      - GOOGLE_PASSWORD=${GOOGLE_PASSWORD:-}
      - PUPPETEER_HEADLESS=true
      
      # Gemini API
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_DEFAULT_MODEL=${GEMINI_DEFAULT_MODEL:-gemini-1.5-flash-latest}
      
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-4o-mini}
      
      # Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_DEFAULT_MODEL=${ANTHROPIC_DEFAULT_MODEL:-claude-3-5-sonnet-20241022}
      
      # Rate Limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      
      # Timeouts
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-300000}
    volumes:
      - ./logs:/app/logs
      - gemini-sessions:/app/sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11434/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ai-router-network

  # Optional: Redis for session storage (future enhancement)
  # redis:
  #   image: redis:7-alpine
  #   container_name: ai-router-redis
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - ai-router-network

volumes:
  ai-sessions:
  # redis-data:

networks:
  ai-router-network:
    driver: bridge
